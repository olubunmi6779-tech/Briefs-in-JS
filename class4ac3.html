<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="id1"> </p>
    <button onclick="f1()">Click me</button>
    <script>
        function f1(){
            var num1 = 12;
            var num2 = 3;
            var num3 = 5;

            var a = eval("num1 + num3") + "<br>";
            var b = eval ("3 + 3") + "<br>";
            var c = eval("num1-num2") + "<br>";

            var result = a + b + c;

            document.getElementById("id1").innerHTML = result

        }

    </script>
</body>
</html>
