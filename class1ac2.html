<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var hello;
        var time = new Date().getHours();

        if (time < 8 ){
            hello = " This is morning";
        }
        else if (time < 12){
            hello = "This is the afternoon";
        }
        else if (time < 16 ){
            hello = "This is evening";
        }
        else{
             hello = "Good Night"; 
            }
            
        
        document.write(hello)

    </script>
</body>
</html>
